# Builds the game once (a plain Linux runner is enough: install.sh's own
# build has no OS-specific output, it's just index.html + doomgeneric.js),
# then wraps that same payload three ways: a self-extracting Linux
# installer (makeself) with an app-menu uninstall entry, a Windows
# installer (NSIS) with Desktop/Start Menu shortcuts and a Control Panel
# uninstall entry, and a macOS .app in a drag-to-Applications .dmg
# (uninstalled the normal macOS way: drag to Trash). All three installers
# let the user pick which freely redistributable WADs to download during
# install (see assets/freeware_pack.py). All four files plus a plain
# source archive are attached to one GitHub Release.
#
# The same tag also deploys the playable site straight to Cloudflare
# Pages (see the deploy-cloudflare-pages job): the freeware pack is
# downloaded fresh on the runner and uploaded to Cloudflare directly via
# the API, so those WAD files never touch this git repo.
#
# assets/icon.png (if present) is picked up automatically and converted to
# .ico / .icns for the platforms that want it; without it, everything
# still builds, shortcuts just use the target file's default icon.
#
# CUTTING A RELEASE
# ------------------
# From a local clone:
#
#     git tag v2.1.1
#     git push --tags
#
# A new GitHub Release appears under the "Releases" tab once the workflow
# finishes (several minutes: it builds the engine, then packages it three
# ways), and the Cloudflare Pages site redeploys with it. See: https://semver.org
#
# CLOUDFLARE PAGES SETUP (one-time)
# -----------------------------------
# 1. Create a Pages project in the Cloudflare dashboard (Workers & Pages >
#    Create > Pages > "Upload assets" / direct upload - do NOT connect it
#    to this GitHub repo, the workflow uploads directly instead).
# 2. Create an API token: My Profile > API Tokens > "Edit Cloudflare
#    Workers" template (or a custom token with Account.Cloudflare Pages:
#    Edit) scoped to your account.
# 3. In this repo: Settings > Secrets and variables > Actions, add:
#      CLOUDFLARE_API_TOKEN   - the token from step 2
#      CLOUDFLARE_ACCOUNT_ID  - found on the right side of any Cloudflare
#                                dashboard page
#      CLOUDFLARE_PAGES_PROJECT - the Pages project name from step 1
#
# RUNNING MANUALLY
# -----------------
# Repo > Actions tab > Release > Run workflow. Enter an existing tag.

name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v1.0.0). Must already exist.'
        required: true
        type: string

permissions:
  contents: write

jobs:
  # =========================================================================
  # Build the engine once. index.html and doomgeneric.js are identical
  # regardless of which OS ends up running them, so this only needs to
  # happen on one runner.
  # =========================================================================
  build-payload:
    name: Build engine
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Run install.sh (engine only, no prompts)
        env:
          FREEWARE: "0"
          WEBEXPORT: "0"
          SITE: "0"
        run: ./install.sh

      - name: Stage payload
        run: |
          mkdir -p payload
          cp "$HOME/doomgeneric/doomgeneric/index.html" payload/
          cp "$HOME/doomgeneric/doomgeneric/doomgeneric.js" payload/

      - name: Upload payload
        uses: actions/upload-artifact@v4
        with:
          name: web-payload
          path: payload/
          retention-days: 1

  # =========================================================================
  # Linux: self-extracting installer via makeself. Installs to
  # ~/.local/share and adds a .desktop entry (app menu + Desktop icon).
  # =========================================================================
  package-linux:
    name: Package (Linux)
    needs: build-payload
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Download payload
        uses: actions/download-artifact@v4
        with:
          name: web-payload
          path: payload

      - name: Install makeself
        run: sudo apt-get update && sudo apt-get install -y makeself

      - name: Build installer
        run: |
          chmod +x installers/linux/build.sh
          VERSION="${{ github.event.inputs.tag || github.ref_name }}"
          installers/linux/build.sh "$VERSION"

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: installer-linux
          path: dist/*.run
          retention-days: 1

  # =========================================================================
  # Windows: NSIS installer with Desktop and Start Menu shortcuts pointing
  # straight at index.html (opens with the default browser).
  # =========================================================================
  package-windows:
    name: Package (Windows)
    needs: build-payload
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Download payload
        uses: actions/download-artifact@v4
        with:
          name: web-payload
          path: payload

      - name: Install NSIS
        run: choco install -y nsis

      - name: Verify payload
        shell: bash
        run: |
          echo "=== Checking payload directory ==="
          ls -la payload/

      - name: Build icon (best effort)
        shell: pwsh
        run: installers/windows/make-icon.ps1

      - name: Compute version
        shell: bash
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "APP_VERSION=${TAG#v}" >> "$GITHUB_ENV"

      - name: Build installer
        working-directory: installers/windows
        shell: cmd
        run: '"C:\Program Files (x86)\NSIS\makensis.exe" /V4 /DVERSION=%APP_VERSION% installer.nsi'

      - name: Rename installer
        shell: bash
        run: |
          mkdir -p dist
          VERSION="${{ github.event.inputs.tag || github.ref_name }}"
          # makensis resolves OutFile relative to the .nsi script's own
          # directory (installers/windows/), not the invocation cwd.
          mv installers/windows/doomgeneric-WASM-windows.exe \
            "dist/doomgeneric-WASM-${VERSION}-windows.exe"

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: installer-windows
          path: dist/*.exe
          retention-days: 1

  # =========================================================================
  # macOS: a minimal .app bundle (a launcher script that opens index.html
  # in the default browser, no compiling) wrapped in a drag-to-Applications
  # .dmg. Unsigned: first launch needs right-click > Open (no Apple
  # Developer account / notarization here).
  # =========================================================================
  package-macos:
    name: Package (macOS)
    needs: build-payload
    runs-on: macos-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Download payload
        uses: actions/download-artifact@v4
        with:
          name: web-payload
          path: payload

      - name: Build .dmg
        run: |
          chmod +x installers/macos/build-dmg.sh
          VERSION="${{ github.event.inputs.tag || github.ref_name }}"
          installers/macos/build-dmg.sh "$VERSION"

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: installer-macos
          path: dist/*.dmg
          retention-days: 1

  # =========================================================================
  # Cloudflare Pages: deploy the playable site straight from this runner.
  # The freeware WAD pack is downloaded fresh here (from its original
  # sources, via assets/freeware_pack.py) and uploaded directly to
  # Cloudflare over the API - it is never committed to git, never a
  # release asset, and never stored anywhere in this repo or its history.
  # Skipped automatically (with a warning) if the Cloudflare secrets
  # below have not been configured yet.
  # =========================================================================
  deploy-cloudflare-pages:
    name: Deploy (Cloudflare Pages)
    needs: build-payload
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Check Cloudflare secrets are configured
        id: cf-check
        run: |
          if [ -n "${{ secrets.CLOUDFLARE_API_TOKEN }}" ] \
             && [ -n "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ] \
             && [ -n "${{ secrets.CLOUDFLARE_PAGES_PROJECT }}" ]; then
            echo "ready=1" >> "$GITHUB_OUTPUT"
          else
            echo "ready=0" >> "$GITHUB_OUTPUT"
            echo "::warning::Cloudflare secrets not set (CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, CLOUDFLARE_PAGES_PROJECT). Skipping Cloudflare Pages deploy - see the setup notes at the top of this workflow file."
          fi

      - name: Download payload
        if: steps.cf-check.outputs.ready == '1'
        uses: actions/download-artifact@v4
        with:
          name: web-payload
          path: site

      - name: Download freeware pack
        if: steps.cf-check.outputs.ready == '1'
        run: |
          mkdir -p site/freeware
          python3 assets/freeware_pack.py site/freeware

      - name: Deploy to Cloudflare Pages
        if: steps.cf-check.outputs.ready == '1'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=${{ secrets.CLOUDFLARE_PAGES_PROJECT }} --branch=main

  # =========================================================================
  # Collect everything and publish one Release.
  # =========================================================================
  release:
    name: Create GitHub Release
    needs: [package-linux, package-windows, package-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Bundle source archive
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          name="${{ github.event.repository.name }}-${tag}"
          mkdir -p dist
          # git archive produces clean source archives that match the exact tag.
          git archive --format=tar.gz --prefix="${name}/" -o "dist/${name}.tar.gz" HEAD
          git archive --format=zip   --prefix="${name}/" -o "dist/${name}.zip"    HEAD

      - name: Download all installers
        uses: actions/download-artifact@v4
        with:
          pattern: installer-*
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: dist/**/*
          fail_on_unmatched_files: false
