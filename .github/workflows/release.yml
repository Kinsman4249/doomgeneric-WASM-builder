# Builds a source archive on a tag push and attaches it to a GitHub Release.
# This project has no compile step (install.sh does its own build against
# emsdk at run time), so the release is just a clean archive of the repo at
# the tagged commit.
#
# CUTTING A RELEASE
# ------------------
# From a local clone:
#
#     git tag v2.1.1
#     git push --tags
#
# A new GitHub Release appears under the "Releases" tab once the workflow
# finishes. See: https://semver.org
#
# RUNNING MANUALLY
# -----------------
# Repo > Actions tab > Release > Run workflow. Enter an existing tag.

name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v1.0.0). Must already exist.'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Bundle source archive
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          name="${{ github.event.repository.name }}-${tag}"
          mkdir -p dist
          # git archive produces clean source archives that match the exact tag.
          git archive --format=tar.gz --prefix="${name}/" -o "dist/${name}.tar.gz" HEAD
          git archive --format=zip   --prefix="${name}/" -o "dist/${name}.zip"    HEAD

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: dist/**/*
          fail_on_unmatched_files: false
